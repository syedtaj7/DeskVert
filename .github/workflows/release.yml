name: Release

# Push a tag like v1.0.0 to build the installer and portable zip and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: tools/build_release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapshift-release
          path: release/*

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $ver")
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith("## "); $i++) { $notes += $lines[$i] }
          }
          if (-not $notes) { $notes = @("Tapshift $ver") }
          $notes | Set-Content -Encoding utf8 release_notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release_notes.md
