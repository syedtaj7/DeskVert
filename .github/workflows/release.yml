name: Release

# Push a tag like v1.0.0 to build the installer and portable zip and attach them to a GitHub Release.
#
# Code signing (SignPath Foundation, free for open source; see docs/SIGNING.md): when the repository variable
# SIGNPATH_ORGANIZATION_ID is set, Deskvert.exe is signed before it's packaged, and the installer after. Without
# it, everything is built exactly the same, unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read  # SignPath downloads the artifacts it signs from this run

env:
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build the app
        shell: pwsh
        run: tools/build_release.ps1 -Stage app

      # The built app runs its own conversions (pictures, PDFs, documents, sound, video stills, archives...) the
      # way people will run them: a build that fails any of them is never packaged or published.
      - name: Self-test the built app
        shell: pwsh
        run: |
          # the usual Windows temp folder: Windows' sound converter can't open files in the runner's own temp folder
          $out = Join-Path $env:TEMP "deskvert-selftest"
          $p = Start-Process -FilePath "dist/Deskvert/Deskvert.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          $report = Join-Path $out "selftest.json"
          if (-not (Test-Path $report)) { throw "The built app didn't write a self-test report (exit code $($p.ExitCode))" }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          foreach ($c in $r.results) { if (-not $c.ok) { Write-Host "FAILED  $($c.case): $($c.error)" } }
          $passed = @($r.results | Where-Object { $_.ok }).Count
          Write-Host "Self-test: $passed of $($r.results.Count) passed in $($r.seconds) s (frozen: $($r.frozen))"
          if (-not $r.ok -or $p.ExitCode -ne 0) { throw "The built app failed its self-test" }

      # ---- sign Deskvert.exe, so the zip and the installer carry the signed app
      - name: Upload Deskvert.exe for signing
        if: env.SIGN == 'true'
        id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/Deskvert/Deskvert.exe
          if-no-files-found: error

      - name: Sign Deskvert.exe (SignPath)
        if: env.SIGN == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          parameters: |
            version: "${{ steps.ver.outputs.value }}"
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # each release is approved by hand in SignPath
          output-artifact-directory: signed/app

      - name: Use the signed Deskvert.exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/app/Deskvert.exe dist/Deskvert/Deskvert.exe -Force
          $sig = Get-AuthenticodeSignature dist/Deskvert/Deskvert.exe
          if ($sig.Status -ne "Valid") { throw "Deskvert.exe isn't validly signed: $($sig.Status)" }

      - name: Package (portable zip and installer)
        shell: pwsh
        run: tools/build_release.ps1 -Stage package

      # ---- sign the installer
      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: setup-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: release/Deskvert-Setup-*.exe
          if-no-files-found: error

      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          parameters: |
            version: "${{ steps.ver.outputs.value }}"
          github-artifact-id: ${{ steps.setup-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # each release is approved by hand in SignPath
          output-artifact-directory: signed/setup

      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed/setup -Filter "Deskvert-Setup-*.exe" | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no installer" }
          Copy-Item $signed.FullName "release/$($signed.Name)" -Force
          $sig = Get-AuthenticodeSignature "release/$($signed.Name)"
          if ($sig.Status -ne "Valid") { throw "The installer isn't validly signed: $($sig.Status)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskvert-release
          path: release/*

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $ver")
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith("## "); $i++) { $notes += $lines[$i] }
          }
          if (-not $notes) { $notes = @("Deskvert $ver") }
          $notes | Set-Content -Encoding utf8 release_notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: release_notes.md
