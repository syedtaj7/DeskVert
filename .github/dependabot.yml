# Library updates arrive as small pull requests, each run through the full test suite before anything is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      small-updates:  # bug-fix releases together in one pull request; bigger updates one at a time
        update-types: ["patch"]
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
