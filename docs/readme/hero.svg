<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Tapshift: select a file, tap Ctrl + Shift, pick a format">
<title>Tapshift: select a file, tap Ctrl + Shift, pick a format</title>
<style>
.s{font-family:'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .m{font-family:'Cascadia Code','Cascadia Mono',Consolas,'SF Mono',Menlo,ui-monospace,monospace}
.b{font-weight:700} .sb{font-weight:600}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){
*{animation:none!important}
.ren,.wm,.pn,.szlast,.zipt,[class*="txt"],.line:first-of-type,.line:first-of-type .ok{opacity:1}
[class*="ink"],.cover{opacity:0}
}

.grid{animation:drift 18s linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-32px,-32px)}}
.rise{animation:rise .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.under{animation:under 1.1s .5s cubic-bezier(.6,0,.2,1) both}
@keyframes under{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.k1{animation:press 4s ease-in-out infinite}
.k2{animation:press 4s .18s ease-in-out infinite}
@keyframes press{0%,8%,30%,100%{transform:none}14%,22%{transform:translateY(6px)}}
.ripple{animation:ripple 4s cubic-bezier(.1,.6,.3,1) infinite;opacity:0}
@keyframes ripple{0%,12%{opacity:0;transform:scale(.55)}16%{opacity:.9}60%,100%{opacity:0;transform:scale(1.35)}}
.orbit{animation:spin 48s linear infinite}
.unspin{animation:spin 48s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dash{animation:dash 6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-120}}
.toast{animation:toast 8s 1.4s cubic-bezier(.2,.9,.2,1) infinite both}
@keyframes toast{0%,4%{opacity:0;transform:translateY(24px)}9%,40%{opacity:1;transform:none}46%,100%{opacity:0;transform:translateY(-10px)}}
.check{stroke-dasharray:30;animation:check 8s 1.4s ease-out infinite both}
@keyframes check{0%,8%{stroke-dashoffset:30}14%,100%{stroke-dashoffset:0}}
.stat{animation:rise .8s cubic-bezier(.2,.9,.2,1) both}

.wpop{animation:wpop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes wpop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.whl{opacity:0;animation:whl 8.0s linear infinite}
@keyframes whl{0%{opacity:0}1.5%{opacity:1}11.00%{opacity:1}12.50%{opacity:0}100%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="1199" height="639" rx="28" fill="#121214" stroke="rgba(255,255,255,0.08)"/>
<defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.07)"/></pattern><clipPath id="cardclip"><rect x="1" y="1" width="1198" height="638" rx="27"/></clipPath></defs>
<g clip-path="url(#cardclip)"><g class="grid"><rect x="0" y="0" width="1264" height="704" fill="url(#dots)"/></g></g>
<g class="rise" style="animation-delay:.05s"><rect x="80" y="92" width="268" height="36" rx="18" fill="#1C1C20" stroke="#303036"/><circle class="dot" cx="102" cy="110" r="5" fill="#34BE84"/><text class="s sb" x="118" y="116" font-size="15" fill="#F0F0EE">v1.1 · free &amp; open source</text></g>
<g class="rise" style="animation-delay:.15s"><text class="s b" x="76" y="236" font-size="104" fill="#F0F0EE" letter-spacing="-3">Tapshift</text></g>
<rect class="fb under" x="82" y="258" width="150" height="8" rx="4" fill="#34BE84" style="transform-origin:left center"/>
<g class="rise" style="animation-delay:0.45s"><text class="s sb" x="80" y="318" font-size="30" fill="#F0F0EE">Select a file.</text></g>
<g class="rise" style="animation-delay:0.65s"><text class="s sb" x="80" y="358" font-size="30" fill="#F0F0EE">Tap Ctrl + Shift.</text></g>
<g class="rise" style="animation-delay:0.85s"><text class="s sb" x="80" y="398" font-size="30" fill="#34BE84">Pick a format.</text></g>
<g class="rise" style="animation-delay:1.1s"><g transform="translate(80,450)"><g class="k1"><rect x="0" y="6" width="108" height="58" rx="12" fill="#0B0B0D"/><rect class="cap" x="0" y="0" width="108" height="58" rx="12" fill="#26262B" stroke="#303036"/><text class="s sb" x="54" y="37" font-size="22" fill="#F0F0EE" text-anchor="middle">Ctrl</text></g></g><text class="s b" x="214" y="488" font-size="28" fill="#96969E" text-anchor="middle">+</text><g transform="translate(240,450)"><g class="k2"><rect x="0" y="6" width="124" height="58" rx="12" fill="#0B0B0D"/><rect class="cap" x="0" y="0" width="124" height="58" rx="12" fill="#26262B" stroke="#303036"/><text class="s sb" x="62" y="37" font-size="22" fill="#F0F0EE" text-anchor="middle">Shift</text></g></g><text class="s" x="386" y="486" font-size="16" fill="#96969E">tap, don't hold</text></g>
<g class="stat" style="animation-delay:1.30s"><text class="s b" x="80" y="574" font-size="30" fill="#F0F0EE">40+</text><text class="s" x="80" y="598" font-size="14" fill="#96969E">formats</text></g>
<g class="stat" style="animation-delay:1.42s"><text class="s b" x="230" y="574" font-size="30" fill="#F0F0EE">17</text><text class="s" x="230" y="598" font-size="14" fill="#96969E">tools</text></g>
<g class="stat" style="animation-delay:1.54s"><text class="s b" x="380" y="574" font-size="30" fill="#F0F0EE">0%</text><text class="s" x="380" y="598" font-size="14" fill="#96969E">CPU when idle</text></g>
