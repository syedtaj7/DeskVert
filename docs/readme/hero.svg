<circle class="fb ripple" style="animation-delay:0.22s" cx="870" cy="300" r="200" fill="none" stroke="#34BE84" stroke-width="2"/>
<circle class="fb ripple" style="animation-delay:0.44s" cx="870" cy="300" r="200" fill="none" stroke="#34BE84" stroke-width="2"/>
