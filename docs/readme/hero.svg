<g class="fb orbit"><circle cx="870" cy="300" r="252" fill="none"/><g transform="translate(958.4,81.2)"><g class="fb unspin"><rect x="-27.1" y="-15" width="54.2" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#34BE84" text-anchor="middle">HEIC</text></g></g><g transform="translate(1087.2,207.8)"><g class="fb unspin"><rect x="-23.1" y="-15" width="46.2" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#F0F0EE" text-anchor="middle">PDF</text></g></g><g transform="translate(1088.8,388.4)"><g class="fb unspin"><rect x="-23.1" y="-15" width="46.2" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#F0F0EE" text-anchor="middle">CSV</text></g></g><g transform="translate(962.2,517.2)"><g class="fb unspin"><rect x="-23.1" y="-15" width="46.2" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#34BE84" text-anchor="middle">ZIP</text></g></g><g transform="translate(781.6,518.8)"><g class="fb unspin"><rect x="-27.1" y="-15" width="54.2" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#F0F0EE" text-anchor="middle">DOCX</text></g></g><g transform="translate(652.8,392.2)"><g class="fb unspin"><rect x="-19.1" y="-15" width="38.1" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#F0F0EE" text-anchor="middle">MD</text></g></g><g transform="translate(651.2,211.6)"><g class="fb unspin"><rect x="-23.1" y="-15" width="46.2" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#34BE84" text-anchor="middle">PNG</text></g></g><g transform="translate(777.8,82.8)"><g class="fb unspin"><rect x="-27.1" y="-15" width="54.2" height="30" rx="15" fill="#1C1C20" stroke="#303036"/><text class="m sb" x="0" y="5" font-size="13" fill="#F0F0EE" text-anchor="middle">JSON</text></g></g></g>
