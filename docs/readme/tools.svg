.photo{animation:photo 6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes photo{0%,10%{transform:scale(1)}55%,88%{transform:scale(.46)}100%{transform:scale(1)}}
.bar{animation:bar 6s cubic-bezier(.6,0,.3,1) infinite}
